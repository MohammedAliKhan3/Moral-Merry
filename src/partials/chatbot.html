  <div class="chatbot" id="chatbot" data-greeting="<%= c.chatbot.greeting %>" data-phone="<%= site.phones[0] && site.phones[0].number %>">
    <button class="chatbot-toggle" type="button" aria-expanded="false" aria-controls="chatbot-window" aria-label="Chat with <%= c.chatbot.name %>">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1L4.5 21l4.3-2.3c1 .2 2.1.3 3.2.3 5.5 0 10-3.6 10-8s-4.5-8-10-8zm-4 9.3a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg>
    </button>
    <section class="chatbot-window" id="chatbot-window" aria-label="<%= c.chatbot.name %> chat" hidden>
      <header class="chatbot-header">
        <span class="chatbot-avatar" aria-hidden="true">🎓</span>
        <div>
          <p class="chatbot-title"><%= c.chatbot.name %></p>
          <p class="chatbot-subtitle">School assistant · <a href="/ai-hub">Open AI Hub</a></p>
        </div>
        <button class="chatbot-close" type="button" aria-label="Close chat">&times;</button>
      </header>
      <div class="chatbot-messages" data-chat-log role="log" aria-live="polite"></div>
      <form class="chatbot-form" data-chat-form>
        <label class="sr-only" for="chatbot-input">Your question</label>
        <input id="chatbot-input" type="text" maxlength="500" placeholder="Ask me something…" autocomplete="off">
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>
    </section>
  </div>
